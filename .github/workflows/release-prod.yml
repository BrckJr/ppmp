name: Release PROD

# Publishing a GitHub Release (tag vX.Y.Z on main) promotes that exact commit to PROD,
# but only if the same commit has been deployed to DEV successfully before.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  gate:
    name: Verify DEV deployment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag must follow vMAJOR.MINOR.PATCH
        run: |
          [[ "${{ github.event.release.tag_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid tag"; exit 1; }
      - name: Commit must be on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA is not on main"; exit 1; }
      - name: Commit must have been deployed to DEV successfully
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$GITHUB_SHA&environment=dev" --jq '.[].id'); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --jq '.[0].state')
            if [ "$state" = "success" ]; then echo "Found successful DEV deployment $id"; exit 0; fi
          done
          echo "::error::$GITHUB_SHA has no successful DEV deployment"
          exit 1

  deploy:
    needs: gate
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: prod
      promote: true
      version: ${{ github.event.release.tag_name }}
    permissions:
      contents: read
      id-token: write
      deployments: write
