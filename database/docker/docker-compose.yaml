services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ppmp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ppmp
      POSTGRES_USER: ppmp-bot
      POSTGRES_PASSWORD: secret
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppmp-bot -d ppmp"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: