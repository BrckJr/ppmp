databaseChangeLog:

  - changeSet:
      id: create-transaction-table
      author: kilian.brickl
      changes:
        - createTable:
            schemaName: ${ppmp.schema}
            tableName: transaction
            columns:
              - column:
                  name: uuid
                  type: uuid
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_transaction
              - column:
                  name: portfolio_uuid
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: instrument_uuid
                  type: uuid
              - column:
                  name: transaction_type
                  type: varchar(20)
              - column:
                  name: timestamp
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: unit_price
                  type: float
              - column:
                  name: quantity
                  type: float
              - column:
                  name: gross_amount
                  type: float
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: varchar(3)
                  constraints:
                    nullable: false
              - column:
                  name: comment
                  type: varchar(255)
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableSchemaName: ${ppmp.schema}
            baseTableName: transaction
            baseColumnNames: portfolio_uuid
            referencedTableSchemaName: ${ppmp.schema}
            referencedTableName: portfolio
            referencedColumnNames: uuid
            constraintName: fk_transaction_portfolio_id
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableSchemaName: ${ppmp.schema}
            baseTableName: transaction
            baseColumnNames: instrument_uuid
            referencedTableSchemaName: ${ppmp.schema}
            referencedTableName: instrument
            referencedColumnNames: uuid
            constraintName: fk_transaction_instrument_id
