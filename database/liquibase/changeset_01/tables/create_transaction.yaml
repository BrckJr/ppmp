databaseChangeLog:
  - changeSet:
      id: create-transaction-table
      author: kilian.brickl
      changes:
        - createTable:
            schemaName: ${ppmp.schema}
            tableName: transaction
            columns:
              - column:
                  name: uuid
                  type: uuid
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_transaction

              - column:
                  name: ticker
                  type: varchar(10)

              - column:
                  name: transaction_type
                  type: varchar(20)
                  constraints:
                    nullable: false

              - column:
                  name: timestamp
                  type: timestamp
                  constraints:
                    nullable: false

              - column:
                  name: unit_price
                  type: decimal(19,6)

              - column:
                  name: quantity
                  type: decimal(19,6)

              - column:
                  name: gross_amount
                  type: decimal(19,6)
                  constraints:
                    nullable: false

              - column:
                  name: currency
                  type: varchar(3)
                  constraints:
                    nullable: false

              - column:
                  name: comment
                  type: varchar(255)

              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false