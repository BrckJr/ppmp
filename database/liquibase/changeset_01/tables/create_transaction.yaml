databaseChangeLog:
  - changeSet:
      id: create-transaction-table
      author: kilian.brickl
      changes:
        - createTable:
            schemaName: ${ppmp.schema}
            tableName: transaction
            columns:
              - column:
                  name: uuid
                  type: uuid
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_transaction

              - column:
                  name: instrument_uuid
                  type: uuid

              - column:
                  name: transaction_type
                  type: varchar(20)
                  constraints:
                    nullable: false

              - column:
                  name: timestamp
                  type: timestamp
                  constraints:
                    nullable: false

              - column:
                  name: unit_price
                  type: decimal(19,6)

              - column:
                  name: quantity
                  type: decimal(19,6)

              - column:
                  name: gross_amount
                  type: decimal(19,6)
                  constraints:
                    nullable: false

              - column:
                  name: currency
                  type: varchar(3)
                  constraints:
                    nullable: false

              - column:
                  name: comment
                  type: varchar(255)

              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableSchemaName: ${ppmp.schema}
            baseTableName: transaction
            baseColumnNames: instrument_uuid
            referencedTableSchemaName: ${ppmp.schema}
            referencedTableName: instrument
            referencedColumnNames: uuid
            constraintName: fk_transaction_instrument_id
            onDelete: RESTRICT

        - createIndex:
            schemaName: ${ppmp.schema}
            tableName: transaction
            indexName: idx_transaction_instrument_uuid
            columns:
              - column:
                  name: instrument_uuid

        - sql:
            sql: >
              ALTER TABLE ${ppmp.schema}.transaction
              ADD CONSTRAINT chk_transaction_instrument_required
              CHECK (transaction_type NOT IN ('BUY', 'SELL', 'DIVIDEND') OR instrument_uuid IS NOT NULL)
