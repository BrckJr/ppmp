quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.driver=org.postgresql.Driver
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/ppmp
quarkus.hibernate-orm.log.sql=true
quarkus.datasource.username=ppmp-bot
quarkus.datasource.password=secret
quarkus.http.root-path=/api
quarkus.smallrye-openapi.info-title=PPMP
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.path=/openapi
quarkus.smallrye-openapi.store-schema-directory=target/openapi
quarkus.smallrye-openapi.store-schema-file-name=openapi
quarkus.smallrye-openapi.store-schema-format=yaml
mp.openapi.schema.annotation-scanner.bean-validation=true
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
# --- Authentication ---
# Session = signed JWT, stored in an HttpOnly cookie (never readable by scripts)
mp.jwt.verify.issuer=ppmp
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=ppmp_session
smallrye.jwt.verify.algorithm=HS256
# Required in every environment except dev/test: base64url-encoded random key of at least 32 bytes,
# e.g. `openssl rand -base64 48 | tr '+/' '-_' | tr -d '='`
mp.jwt.verify.publickey={"kty":"oct","alg":"HS256","k":"${PPMP_JWT_SECRET}"}
ppmp.auth.jwt-secret=${PPMP_JWT_SECRET}
%dev.PPMP_JWT_SECRET=ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS0wMTIzNDU2Nzg5YWJjZGVmMDEyMzQ1
%test.PPMP_JWT_SECRET=dGVzdC1vbmx5LXNlY3JldC0wMTIzNDU2Nzg5YWJjZGVmZ2hpamtsbW5v
ppmp.auth.session-duration=PT8H
ppmp.auth.cookie-secure=true
%dev.ppmp.auth.cookie-secure=false
%test.ppmp.auth.cookie-secure=false
# Everything is private unless it is explicitly listed as public
quarkus.http.auth.permission.public.paths=/api/auth/login,/api/auth/register,/api/auth/logout
quarkus.http.auth.permission.public.policy=permit
# Health probes (readiness includes the database check) are used by the deployment smoke test
quarkus.http.auth.permission.health.paths=/api/q/health/*
quarkus.http.auth.permission.health.policy=permit
quarkus.http.auth.permission.private.paths=/api/*
quarkus.http.auth.permission.private.policy=authenticated
quarkus.http.cors.access-control-allow-credentials=true
